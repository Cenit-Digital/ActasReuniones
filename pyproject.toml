[project]
name = "actas"
version = "0.1.0"
description = "Actas de las reuniones de socios de Cenit Digital: supervisor del grabador y cliente de la plataforma de transcripción"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "psycopg[binary]>=3.2",
    "websockets>=15.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.14",
    "mypy>=1.18",
    "cosmic-ray>=8.7",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/actas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = ["integracion: necesita PostgreSQL (ACTAS_DSN_PRUEBAS)"]

[tool.ruff]
line-length = 130
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108"]

[tool.mypy]
files = ["src"]
strict = true
python_version = "3.12"

# Las migraciones viajan dentro del paquete (actas/migraciones): base.migrar las busca ahí en la imagen.
[tool.hatch.build.targets.wheel.force-include]
"migraciones" = "actas/migraciones"
