name: Imagen

# Construye, prueba y publica en GHCR la imagen del supervisor de las actas: ghcr.io/cenit-digital/actas-supervisor. La misma
# imagen sirve el panel de F2 (`python -m actas.panel`).
# - Job `imagen` (siempre, sin permisos de escritura): construye, arranca la imagen con raíz de solo lectura y la escanea.
# - Job `publicar` (solo push a main o a mano desde main; único con packages: write): publica :sha-<commit> y deja en el
#   resumen la referencia con digest, que es lo que se copia al Deployment de KubernetesInfrastructure.
# Etiquetas inmutables y nunca `latest`. Acciones fijadas por hash de commit (la versión, en el comentario).
# Repo público: estos minutos de Actions no cuentan para el cupo de la organización.

on:
  push:
    branches: [main]
    paths: &rutas
      - "src/**"
      - "migraciones/**"
      - "textos/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/imagen.yml"
  pull_request:
    paths: *rutas
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: imagen-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGEN: ghcr.io/cenit-digital/actas-supervisor
  PRUEBA: local/actas-supervisor:prueba

jobs:
  imagen:
    name: Construir y probar
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - name: Construir para probar
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          sbom: false
          cache-from: type=gha,scope=supervisor
          cache-to: type=gha,mode=max,scope=supervisor
          build-args: REVISION=${{ github.sha }}
          tags: ${{ env.PRUEBA }}
      - name: Humo (raíz de solo lectura, sin capacidades, usuario 1000)
        run: |
          set -euo pipefail
          r() { docker run --rm --read-only --tmpfs /tmp --user 1000:1000 --cap-drop ALL --security-opt no-new-privileges "$PRUEBA" "$@"; }
          # Sin argumentos, la orden imprime su ayuda y sale con 2: se comprueba la ayuda, no el código.
          { r actas.cli 2>&1 || true; } | grep -q "python -m actas.cli grabar"
          # Las migraciones van dentro del paquete instalado.
          docker run --rm --read-only --user 1000:1000 --entrypoint /opt/actas/venv/bin/python "$PRUEBA" -I -c \
            "from actas import base; assert [n for n, _ in base._migraciones()] == ['0001_esquema.sql', '0002_panel.sql', '0003_salas.sql', '0005_eventos.sql', '0006_programar.sql']"
          # El commit va dentro de la imagen, para el latido del supervisor (V4 de KubernetesInfrastructure#298).
          docker image inspect -f '{{range .Config.Env}}{{println .}}{{end}}' "$PRUEBA" | grep -qx "ACTAS_REVISION=$GITHUB_SHA"
          # Sin configuración, el supervisor falla al instante y sin trazas con secretos.
          if r actas 2>/dev/null; then echo "::error::arrancó sin configuración"; exit 1; fi
      - name: Humo del panel (raíz de solo lectura, usuario 1000, sin /tmp escribible)
        run: |
          set -euo pipefail
          # Sin configuración, el panel también falla al instante y sin traza.
          if docker run --rm --read-only --user 1000:1000 "$PRUEBA" actas.panel 2>/tmp/panel.err; then
            echo "::error::el panel arrancó sin configuración"; exit 1
          fi
          grep -qx "el panel no pudo arrancar: KeyError" /tmp/panel.err
          d="$(mktemp -d)"
          # Una clave de las salas de usar y tirar (32 bytes en base64, como el Secret actas-salas-clave): solo para arrancar.
          head -c 32 /dev/urandom | base64 > "$d/clave"
          echo 'secreto-de-humo' > "$d/proxy"
          chmod 755 "$d"; chmod 644 "$d/clave" "$d/proxy"
          # El DSN no se usa hasta la primera consulta: /salud no toca la base.
          docker run -d --name panel --read-only --user 1000:1000 --cap-drop ALL --security-opt no-new-privileges \
            -v "$d:/config:ro" -e ACTAS_SALAS_CLAVE_FICHERO=/config/clave -e ACTAS_SECRETO_PROXY_FICHERO=/config/proxy \
            -e ACTAS_DSN=postgresql:///actas -e ACTAS_ORIGEN=http://127.0.0.1:8080 \
            -p 127.0.0.1:18080:8080 "$PRUEBA" actas.panel
          # Mientras uvicorn arranca, docker-proxy acepta y corta la conexión («Connection reset by peer»): la espera va en silencio y
          # la comprobación de la línea siguiente, con -fsS, es la que falla si al final no responde.
          for _ in $(seq 1 30); do curl -fs -o /dev/null http://127.0.0.1:18080/salud && break; sleep 1; done
          curl -fsS -D /tmp/salud.h http://127.0.0.1:18080/salud | grep -qx ok
          if grep -qi '^server:' /tmp/salud.h; then echo "::error::cabecera Server"; exit 1; fi
          grep -qi "^content-security-policy: default-src 'none'" /tmp/salud.h
          # Sin el secreto de la ruta de Traefik, o sin su cabecera de usuario, 401.
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'X-Actas-Usuario: humo' http://127.0.0.1:18080/)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'X-Actas-Proxy: secreto-de-humo' http://127.0.0.1:18080/)" = 401
          # @a32: sin registro de accesos y el error (aquí, sin base) solo por su tipo: la consulta no sale en el registro.
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'X-Actas-Usuario: humo' -H 'X-Actas-Proxy: secreto-de-humo' \
            'http://127.0.0.1:18080/buscar?q=marcaunicahumo')" = 500
          # V1 y V2: la hoja, el JavaScript (tema y «Copiar») y las fuentes van dentro de la imagen (el wheel), con su tipo.
          for f in estilo.css tema.js copiar.js fuentes/manrope-latin.woff2 fuentes/gilda-display-400-latin.woff2 \
            fuentes/jetbrains-mono-latin.woff2 fuentes/OFL-manrope.txt; do
            curl -fsS -o /dev/null -w "%{http_code} %{content_type} $f\n" -H 'X-Actas-Usuario: humo' \
              -H 'X-Actas-Proxy: secreto-de-humo' "http://127.0.0.1:18080/$f"
          done | tee /tmp/estaticos.txt
          test "$(grep -c '^200 ' /tmp/estaticos.txt)" = 7
          grep -q '^200 font/woff2 fuentes/manrope-latin.woff2$' /tmp/estaticos.txt
          docker logs panel > /tmp/panel.log 2>&1
          grep -q "petición fallida: OperationalError" /tmp/panel.log
          if grep -q marcaunicahumo /tmp/panel.log; then echo "::error::la consulta salió en el registro"; exit 1; fi
          # Un formulario del panel desde un Chromium real («Crear sala», que no consulta la base antes del POST): el de
          # producción (la imagen de Playwright del job grabador de harness-ci.yml, que solo trae los navegadores: su paquete de
          # Python se borra al construirla), manejado por CDP con actas.cdp desde esta misma imagen. Los dos, en la red del contenedor del panel. El navegador pone Origin y Sec-Fetch-Site, no el test: pasa la
          # defensa CSRF y, sin base, falla en repo.crear_sala (500); un 403 con `Origin: null` es el fallo de la prueba real de
          # KubernetesInfrastructure#287.
          docker run -d --name navegador --network container:panel --user pwuser \
            mcr.microsoft.com/playwright/python@sha256:72bd171a9ffc2b4b59532aaa6210e21014d07093120dc25528870c0b840da1f0 \
            /ms-playwright/chromium-1243/chrome-linux64/chrome --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --remote-debugging-port=9222 --user-data-dir=/tmp/perfil about:blank
          docker run --rm --network container:panel --read-only --user 1000:1000 --cap-drop ALL --security-opt no-new-privileges \
            --entrypoint /opt/actas/venv/bin/python "$PRUEBA" -I -c '
          import time
          from actas.cdp import Cdp, esperar_chromium
          from actas.registro import Registro
          P = "http://127.0.0.1:8080"
          esperar_chromium("http://127.0.0.1:9222", plazo_s=30, intervalo_s=1)
          cdp = Cdp("http://127.0.0.1:9222", Registro())
          post = {}
          def ver(m):
              p = m.get("params", {})
              if m.get("method") == "Network.requestWillBeSent" and p["request"]["method"] == "POST":
                  post["id"] = p["requestId"]
              elif m.get("method") == "Network.requestWillBeSentExtraInfo" and p.get("requestId") == post.get("id"):
                  post["origin"] = {k.lower(): v for k, v in p["headers"].items()}.get("origin")
              elif m.get("method") == "Network.responseReceived" and p.get("requestId") == post.get("id"):
                  post["estado"] = p["response"]["status"]
          cdp.manejadores.append(ver)
          t = cdp.enviar("Target.createTarget", {"url": "about:blank"})["targetId"]
          s = cdp.enviar("Target.attachToTarget", {"targetId": t, "flatten": True})["sessionId"]
          cdp.enviar("Network.enable", sesion=s)
          cdp.enviar("Network.setExtraHTTPHeaders", {"headers": {"X-Actas-Proxy": "secreto-de-humo", "X-Actas-Usuario": "humo"}}, sesion=s)
          cdp.enviar("Page.navigate", {"url": P + "/salas/nueva"}, sesion=s)
          for _ in range(50):
              if cdp.evaluar(s, "!!document.querySelector(`form[method=post]`)"):
                  break
              time.sleep(0.2)
          cdp.evaluar(s, "document.querySelector(`input[name=nombre]`).value = `Humo`; document.querySelector(`form[method=post] button`).click()")
          for _ in range(50):
              if "estado" in post and "origin" in post:
                  break
              time.sleep(0.2)
          print("POST /salas:", post.get("estado"), "Origin:", post.get("origin"))
          assert post.get("origin") == P and post.get("estado") == 500, post
          '
          docker rm -f navegador >/dev/null
          docker rm -f panel >/dev/null
      # 150 MB desde F1; 175 MB desde V2 de KubernetesInfrastructure#298 (decisión de Pablo, 2026-10-27): `cryptography` (AES-GCM
      # de las salas) añade unos 16 MB, 14 de ellos su biblioteca de Rust, y la imagen pasó de 149 a 166 MB.
      - name: Tamaño (tope 175 MB sin comprimir)
        run: |
          set -euo pipefail
          bytes="$(docker image inspect "$PRUEBA" --format '{{.Size}}')"
          echo "actas-supervisor: $((bytes / 1000000)) MB" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$bytes" -lt 175000000 ] || { echo "::error::la imagen supera el tope"; exit 1; }
      - name: Vulnerabilidades (trivy, CRITICAL y HIGH con arreglo)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ env.PRUEBA }}
          version: v0.70.0
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  publicar:
    name: Publicar
    needs: imagen
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construir y publicar :sha-<commit>
        id: publicar
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=supervisor
          build-args: REVISION=${{ github.sha }}
          tags: ${{ env.IMAGEN }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      # La publicada se reconstruye desde las mismas entradas fijadas y la caché del job imagen: se escanea otra vez, ya en el
      # registro y por su digest, para que lo escaneado sea exactamente lo que se despliega.
      - name: Vulnerabilidades de la imagen publicada (por digest)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ env.IMAGEN }}@${{ steps.publicar.outputs.digest }}
          version: v0.70.0
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Referencia por digest
        env:
          DIGEST: ${{ steps.publicar.outputs.digest }}
        run: |
          { echo "## Imagen publicada"; echo; echo '```'; echo "$IMAGEN:sha-$GITHUB_SHA@$DIGEST"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
